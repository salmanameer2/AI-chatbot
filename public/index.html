<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with an AI assistant — ask anything and get instant answers." />
  <title>AI-Chatbot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#06080a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- ✅ Emoji picker styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.2/dist/style.css" />
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>

  <main class="page">
    <header class="hero">
      <h1 class="hero-title">Chat with <span class="accent">AI</span></h1>
      <p class="hero-subtitle">Hi! How can I help you today?</p>

      <button id="chatbot-toggler" type="button" aria-controls="chatbot-popup" aria-expanded="false">
        <span class="material-symbols-rounded" aria-hidden="true">forum</span>
        <span class="toggler-label">Chat with AI</span>
        <span class="material-symbols-rounded toggler-arrow" aria-hidden="true">arrow_outward</span>
      </button>
    </header>

    <section class="chat-stage" aria-label="Chat demo">
      <div class="chatbot-popup" id="chatbot-popup">
        <div class="chat-header">
          <div class="header-info">
            <div class="logo-tile">
              <svg class="chatbot-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.4l1.7 5.2a4.2 4.2 0 0 0 2.7 2.7l5.2 1.7-5.2 1.7a4.2 4.2 0 0 0-2.7 2.7L12 21.6l-1.7-5.2a4.2 4.2 0 0 0-2.7-2.7L2.4 12l5.2-1.7a4.2 4.2 0 0 0 2.7-2.7L12 2.4Z" />
              </svg>
            </div>
            <div class="logo-copy">
              <h2 class="logo-text">Chatbot</h2>
              <span class="logo-status"><span class="status-dot"></span><span id="chat-status-text">Online · Ready to chat</span></span>
            </div>
          </div>

          <div class="header-actions">
            <div class="model-selector" id="model-selector">
              <button
                type="button"
                class="model-trigger"
                id="model-trigger"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="model-menu"
              >
                <span class="material-symbols-rounded model-trigger-icon" aria-hidden="true">auto_awesome</span>
                <span class="model-trigger-copy">
                  <span class="model-trigger-label">Model</span>
                  <span class="model-trigger-name" id="selected-model-name">GPT-OSS 120B</span>
                </span>
                <span class="free-badge">FREE</span>
                <span class="material-symbols-rounded model-chevron" aria-hidden="true">expand_more</span>
              </button>

              <div class="model-menu" id="model-menu" hidden>
                <div class="model-menu-header">
                  <div>
                    <p class="model-menu-title">Choose a model</p>
                    <p class="model-menu-subtitle">Groq free-plan models only</p>
                  </div>
                  <span class="model-menu-verified" id="model-menu-verified" title="Model list reviewed against Groq's catalog">
                    <span class="material-symbols-rounded" aria-hidden="true">verified</span>
                    Free
                  </span>
                </div>

                <div class="model-list" id="model-list" role="listbox" aria-label="Groq AI models"></div>

                <div class="model-menu-status" id="model-menu-status" role="status" hidden></div>

                <div class="model-menu-footer">
                  No paid fallback. Groq free-plan rate limits apply.
                </div>
              </div>
            </div>

            <button type="button" id="clear-chat" class="clear-chat" aria-label="Clear chat">
              <span class="material-symbols-rounded clear-chat-icon" aria-hidden="true">delete_sweep</span>
              <span class="clear-chat-label">Clear chat</span>
            </button>
            <button id="close-chatbot" class="material-symbols-rounded" type="button" aria-label="Close chat">keyboard_arrow_down</button>
          </div>
        </div>

        <div class="chat-body" role="log" aria-live="polite">
          <div class="message bot-message">
            <svg class="bot-avatar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="7.5" width="16" height="12" rx="4" />
              <path d="M12 3.5v3.2" />
              <circle cx="12" cy="2.3" r="1.2" fill="currentColor" stroke="none" />
              <circle cx="9.2" cy="12.8" r="1.1" fill="currentColor" stroke="none" />
              <circle cx="14.8" cy="12.8" r="1.1" fill="currentColor" stroke="none" />
              <path d="M9.6 16.2h4.8" />
            </svg>
            <div class="message-text">Hey there 👋<br>How can I help you today?</div>
          </div>
        </div>

        <div class="chat-footer">
          <div class="composer-notice" id="composer-notice" role="status" hidden></div>
          <form action="#" class="chat-form">
            <textarea placeholder="Enter Your Message..." class="message-input" required aria-label="Message"></textarea>
            <div class="chat-controls">
              <button type="button" id="emoji-picker" class="material-symbols-rounded" aria-label="Add emoji">sentiment_satisfied</button>
              <div class="file-upload-wrapper">
                <input type="file" accept="image/*" id="file-input" hidden />
                <img alt="Selected attachment preview" />
                <button type="button" id="file-upload" class="material-symbols-rounded" aria-label="Attach image">attach_file</button>
                <button type="button" id="file-cancel" class="material-symbols-rounded" aria-label="Remove attachment">close</button>
              </div>
              <button type="submit" id="send-message" class="material-symbols-rounded" aria-label="Send message">arrow_upward</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Floating launcher stays visible while the chat is minimized/closed. -->
  <button
    id="chat-fab"
    class="chat-fab"
    type="button"
    aria-controls="chatbot-popup"
    aria-expanded="false"
    aria-label="Open chat"
    title="Open chat"
  >
    <span class="material-symbols-rounded" aria-hidden="true">forum</span>
  </button>

  <!-- Linking emoji Mart script from emoji picker -->
  <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
  <script src="script.js"></script>
</body>
</html>
